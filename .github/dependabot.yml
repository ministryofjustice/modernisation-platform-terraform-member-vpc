---
version: 2

updates:
  # Dependency management strategy:
  # ministryofjustice/modernisation-platform#8211
  #
  # Major and minor/patch version updates are grouped separately, with both
  # checked monthly to reduce routine Dependabot PR noise.
  #
  # Monthly is a compromise, not the ticket's proposed fortnightly major
  # and six-monthly minor/patch cadence.
  #
  # Dependabot alerts and security updates must be enabled separately in
  # repository/org settings; security updates do not wait for this schedule.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      action-major:
        update-types:
          - "major"
      action-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      terraform-major:
        update-types:
          - "major"
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      gomod-major:
        update-types:
          - "major"
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"
